[tool.ruff]
line-length = 88
target-version = "py38"
extend-exclude = [".github", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",    # the formatter takes care of the line length
    "SIM105",  # contextlib.suppress is slower on the Kodi python builds
    "UP031",   # percent formatting is used for the translated strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B018"]

[tool.ruff.format]
quote-style = "double"
