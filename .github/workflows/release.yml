name: Release

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Run title shown in the Actions UI"
        required: false
        default: "Release"
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

run-name: ${{ github.event.head_commit.message || github.event.inputs.title || 'Release' }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run the test suite
        run: python -m pytest tests

      - name: Check add-on
        run: python3 .github/scripts/check_addon.py

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: 'AutoWidget ${{ steps.release.outputs.new_release_version }}'
          subject-path: dist/plugin.program.autowidget-*.zip

      - name: Back-merge main into dev
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev
          git checkout -B dev origin/dev
          if ! git merge origin/main --no-edit; then
            # The release metadata of main and dev conflict, both files are
            # written by the release workflow, so the version of dev is kept.
            git checkout --ours CHANGELOG.md plugin.program.autowidget/addon.xml
            git add CHANGELOG.md plugin.program.autowidget/addon.xml
            git commit --no-edit
          fi
          git push origin dev
