name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        type: string
        default: '1.0.0'
      publish:
        description: 'Publish the add-on to the Kodi repository'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run the test suite
        run: python -m pytest tests

      - name: Check add-on
        run: python3 .github/scripts/check_addon.py

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${TAG_NAME#v}}"
          if [ -z "$VERSION" ]; then
            echo "No version could be determined" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build the add-on
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/build_addon.py \
            --version "$VERSION" \
            --addon-path plugin.program.autowidget \
            --output-dir dist

      - name: Build the repository add-on
        run: |
          set -euo pipefail
          REPOSITORY_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('repository.autowidget/addon.xml').getroot().get('version'))")
          python3 .github/scripts/build_addon.py \
            --version "$REPOSITORY_VERSION" \
            --addon-path repository.autowidget \
            --output-dir dist

      - name: Check the built add-on
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/check_addon.py \
            --zip "dist/plugin.program.autowidget-${VERSION}.zip" \
            --version "$VERSION"

      - name: Generate the Kodi repository
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/generate_repository.py \
            --version "$VERSION" \
            --addon-zip "dist/plugin.program.autowidget-${VERSION}.zip" \
            --output-dir dist/repository

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin.program.autowidget-release
          path: |
            dist/*.zip
            dist/repository/**
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin.program.autowidget-release
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.build.outputs.version }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          prerelease: ${{ contains(needs.build.outputs.version, '~') }}
          files: |
            dist/plugin.program.autowidget-*.zip
            dist/repository.autowidget-*.zip
          generate_release_notes: true

      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: 'AutoWidget ${{ needs.build.outputs.version }}'
          subject-path: dist/plugin.program.autowidget-*.zip

  backmerge:
    name: Back-merge main to dev
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check for differences
        id: diff
        run: |
          set -euo pipefail
          git fetch --quiet origin main dev
          if [ -z "$(git log --oneline origin/dev..origin/main)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "dev already contains main, no back-merge is needed"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open back-merge pull request
        id: backmerge
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        uses: repo-sync/pull-request@v2
        with:
          source_branch: main
          destination_branch: dev
          pr_title: 'chore: Back-merge main to dev'
          pr_body: |
            This pull request back-merges `main` into `dev` after a release.
          pr_draft: true

      - name: Report the result
        if: steps.diff.outputs.changed == 'true' && steps.backmerge.outcome == 'failure'
        run: |
          echo "::warning::The back-merge pull request could not be created. Enable" \
            "'Allow GitHub Actions to create and approve pull requests' in the" \
            "repository settings (Settings > Actions > General > Workflow permissions)."

  publish:
    name: Publish to the Kodi repository
    needs: [build, release]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin.program.autowidget-release
          path: dist

      - name: Publish the repository files
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet refs/remotes/origin/repo; then
            git checkout -B repo origin/repo
          else
            git checkout --orphan repo
            git rm -rf --cached . > /dev/null 2>&1 || true
          fi

          # The Kodi repository layout expected by the repository add-on:
          #   zips/addons.xml, zips/addons.xml.md5
          #   zips/<addon.id>/<addon.id>-<version>.zip
          rm -rf zips
          cp -r dist/repository zips

          # The repository add-on zip, installable directly from the branch.
          cp dist/repository.autowidget-*.zip .

          git add -A zips ./*.zip
          if git diff --cached --quiet; then
            echo "Nothing to publish, the repository files are already up to date"
          else
            git commit -m "chore: Release version ${VERSION}"
            git push origin repo
          fi
